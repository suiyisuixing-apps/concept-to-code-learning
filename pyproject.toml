[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-to-code-learning"
version = "0.2.0.dev0"
description = "Document-centered learning with verified GitHub evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.26.0", "fastapi==0.141.1", "uvicorn==0.52.4",
                "pydantic==2.13.5", "starlette==1.6.0", "httpx==0.28.1",
                "pypdf==6.18.0", "python-pptx==1.0.2", "python-docx==1.2.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.6", "PyYAML==6.0.3", "httpx==0.28.1", "pillow==12.3.0"]

[project.scripts]
concept-to-code = "concept_to_code_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
