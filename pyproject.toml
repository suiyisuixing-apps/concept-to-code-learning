[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-to-code-learning"
version = "0.2.0.dev0"
description = "Document-centered learning with verified GitHub evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.23,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "PyYAML>=6,<7", "httpx>=0.28,<1"]

[project.scripts]
concept-to-code = "concept_to_code_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
