[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "concept-to-code-onboarding"
version = "0.1.0.dev0"
description = "Source-grounded concept-to-code onboarding skill scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "PyYAML>=6,<7"]

[project.scripts]
concept-to-code = "concept_to_code.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
